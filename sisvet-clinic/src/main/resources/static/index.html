<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISVET-CLINIC | Login</title>
    <link rel="stylesheet" href="/css/sisvet.css">
</head>

<body class="login-page">

    <div class="login-shell">

        <!-- Panel informativo -->
        <section class="login-intro">
            <p class="login-eyebrow">SISVET-CLINIC</p>
            <h1>La salud de tus pacientes, organizada en un solo lugar</h1>

            <ul class="login-benefits">
                <li>Clientes y pacientes en un solo lugar</li>
                <li>Gestiona ventas, inventario y compras</li>
                <li>Consulta la actividad de tu clínica</li>
            </ul>

            <!-- Imagen principal del login -->
            <img class="login-main-image" src="/images/test-image.jpg" alt="Imagen de la clinica">

            <p class="login-footer">Sistema de gestión veterinaria</p>
        </section>

        <!-- Formulario de acceso -->
        <section class="login-panel">
            <a class="login-brand" href="/index.html" aria-label="SISVET-CLINIC inicio">
                <img src="/images/paw-placeholder.svg" alt="">
                <span>SISVET-CLINIC</span>
            </a>

            <div class="login-form-wrap">
                <h2>Iniciar sesión</h2>
                <p class="login-subtitle">Ingresa tus datos para continuar</p>

                <form id="loginForm">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" required autocomplete="username">

                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required autocomplete="current-password">

                    <button type="submit" id="loginButton">Iniciar sesión</button>
                </form>

                <p id="message" role="alert"></p>
            </div>
        </section>
    </div>

    <script>

        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        let csrfToken = null;

        async function loadCsrfToken() {

            const response = await fetch("/api/auth/csrf", {
                credentials: "same-origin"
            });

            if (!response.ok) {
                throw new Error("No se pudo obtener el token de seguridad.");
            }

            csrfToken = await response.json();
        }

        function redirectToPanel() {
            window.location.replace("/panel.html");
        }

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "";
            loginButton.disabled = true;
            loginButton.textContent = "Iniciando sesión...";

            try {

                if (!csrfToken) {
                    await loadCsrfToken();
                }

                const response = await fetch("/api/auth/login", {

                    method: "POST",
                    credentials: "same-origin",

                    headers: {
                        "Content-Type": "application/json",
                        [csrfToken.headerName]: csrfToken.token
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                if (!response.ok) {

                    if (response.status === 401) {
                        message.textContent = "Usuario o contraseña incorrectos.";
                    } else if (response.status === 403) {
                        csrfToken = null;
                        message.textContent = "La sesión de seguridad expiró. Intenta nuevamente.";
                    } else {
                        message.textContent = "No se pudo iniciar sesión.";
                    }

                    return;
                }

                redirectToPanel();

            } catch (error) {

                message.textContent = "Error de conexión con el servidor.";
                console.error(error);

            } finally {

                loginButton.disabled = false;
                loginButton.textContent = "Iniciar sesión";
            }
        });

        async function checkSession() {

            try {

                await loadCsrfToken();

                const response = await fetch("/api/auth/me", {
                    credentials: "same-origin"
                });

                if (response.ok) {
                    redirectToPanel();
                }

            } catch (error) {

                console.error("No se pudo comprobar la sesión:", error);
            }
        }

        checkSession();

    </script>

</body>
</html>
