<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacunaciones | SISVET-CLINIC</title>
    <link rel="stylesheet" href="/css/sisvet.css">
</head>
<body>
<div class="layout">
    <aside id="navigation"></aside>
    <main class="content">

            <p>El flujo de vacunación está integrado con Recepción y Atención Clínica para evitar duplicar llegadas.</p>
        </header>
        <section class="card">
            <p>Redirigiendo a la vista integrada...</p>
            <div class="actions">
                <a class="button-link" href="/consultas.html?tab=vaccination">Ir a Atención clínica</a>
            </div>
        </section>
    </main>
</div>
<script src="/js/sisvet.js"></script>
<script>
    (async () => {
        if (await Sisvet.init("Atención clínica")) {
            await Sisvet.navigateTo("/consultas.html?tab=vaccination");
        }
    })();
</script>
</body>
</html>
